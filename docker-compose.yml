name: controle-gastos

services:
  db:
    image: postgres:16-alpine
    container_name: controle-gastos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-controle_gastos}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-controle_gastos}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: controle-gastos-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-controle_gastos};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Cors__Origins: ${CORS_ORIGINS:-http://localhost:3000;http://localhost:5173}
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: controle-gastos-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  pgdata:
    name: controle-gastos-pgdata
